name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, e.g. v1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Release notes (used for the tag annotation and the GitHub Release body)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    permissions:
      contents: write # required to push the tag and create the GitHub Release

    steps:
      - name: Validate version and resolve release notes
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected semver like v1.0.0 (optionally v1.0.0-rc.1)."
            exit 1
          fi
          NOTES="${{ inputs.release_notes }}"
          if [[ -z "$NOTES" ]]; then
            NOTES="Release $VERSION"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$NOTES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: main # always release the latest commit of main
          fetch-depth: 0 # full history so the tag is annotated correctly and notes can be generated

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:prod

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          OUT=$(npx --yes firebase-tools@15.22.3 deploy \
                  --only hosting --project vote-9f5e2 --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "is the current active version"; then
            echo "::warning::Release already applied server-side; treating duplicate-retry 400 as success."
            exit 0
          fi
          exit $CODE

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$RELEASE_NOTES"
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --target main
