name: Deploy to Development

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:dev

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          set +e
          OUT=$(npx --yes firebase-tools@15.22.3 deploy \
                  --only hosting --project scrum-suite-dev --non-interactive 2>&1)
          CODE=$?
          echo "$OUT"
          if [ $CODE -ne 0 ] && echo "$OUT" | grep -q "is the current active version"; then
            echo "::warning::Release already applied server-side; treating duplicate-retry 400 as success."
            exit 0
          fi
          exit $CODE
